# cargo-audit config for the Marley fork (gate:7).
#
# Policy (CONSTITUTION §0): advisories that were already present in upstream
# Zed's dependency tree at the fork point belong to upstream. They are listed
# here per id, each with the crate that carries it, so the gate stays green on
# what the fork inherited and goes RED on any advisory Marley adds. Regenerate
# this list at every upstream merge (`cargo audit -f Cargo.lock --json`) and
# drop the ids upstream fixed. Inherited at upstream commit 78648aaf7d
# (zed-industries/zed main, 2026-09-18). Unmaintained, unsound and yanked
# notices are warnings and do not fail the gate. Regenerated at #952 against
# upstream main 3d3bd04fad (2026-11-19): rkyv, rustls 0.23.40, zip 0.6.6 and the
# webpki-roots shim's ids no longer match the tree, and ammonia, quinn-proto and
# quinn-udp took their patch releases instead of a line here.

[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa 0.9.10 — Marvin timing side channel; upstream tree (no fixed version)
  "RUSTSEC-2026-0194", # quick-xml 0.30/0.37/0.39 — quadratic duplicate-attribute check; upstream tree
  "RUSTSEC-2026-0195", # quick-xml 0.30/0.37/0.39 — NsReader allocation DoS; upstream tree
  "RUSTSEC-2026-0204", # crossbeam-epoch 0.9.18 — fmt::Pointer on an invalid pointer; upstream tree
  "RUSTSEC-2026-0258", # h2 0.3/0.4 — unbounded empty DATA frames; upstream tree
  "RUSTSEC-2026-0274", # rtrb 0.3.2 — double free in ReadChunk::commit; upstream tree
  # crypto-bigint 0.4.9 and 0.5.5 come in through aws-sigv4's sigv4a feature (Zed's AWS SDK for
  # Bedrock), 0.4.9 by way of its p256 0.11. The fix is 0.7.6; the newest aws-sigv4, 1.6.3, still
  # asks for `^0.5.4`, so no version in range is fixed. Upstream main 56934ec056 (2026-10-17) locks
  # the same two. Listed 2026-10-25, the advisory's second day.
  "RUSTSEC-2026-0387", # crypto-bigint 0.4.9/0.5.5 — timing variability in constant-time ops; upstream tree
  # zstd 0.13.3 is Zed's workspace `zstd = "0.13"` (agent, crashes, edit_prediction, rpc) and
  # include-flate-compress's; zstd-safe 7.3.0 is its. The fixes are zstd 0.14.3 and zstd-safe
  # 8.2.0, a major step past every requirement in the tree. Upstream main 5e8998a2a7 (2026-10-28)
  # locks the same. zstd-sys moved to 2.1.2 for RUSTSEC-2026-0410. Listed 2026-10-28, the day the
  # ids reached the database here.
  "RUSTSEC-2026-0391", # zstd 0.13.3 — an abandoned stream's data leaks into the next; upstream tree
  "RUSTSEC-2026-0398", # zstd-safe 7.3.0 — Seekable::decompress sets a Vec length past capacity; upstream tree
  "RUSTSEC-2026-0403", # zstd-safe 7.3.0 — uninitialised memory on a failed legacy frame; upstream tree
  # libsqlite3-sys 0.30.1 is Zed's workspace pin (`libsqlite3-sys = "0.30.1"`, bundled), taken by
  # sqlez alone. The fix is 0.39.0, a breaking step for a 0.x crate that upstream's Cargo.toml
  # would have to take. Upstream main 3d3bd04fad (2026-11-19) locks the same. Listed at #952.
  "RUSTSEC-2026-0459", # libsqlite3-sys 0.30.1 — bundled SQLite CVE-2026-119375; upstream tree
]
