# cargo-audit config for the Marley fork (gate:7).
#
# Policy (CONSTITUTION §0): advisories that were already present in upstream
# Zed's dependency tree at the fork point belong to upstream. They are listed
# here per id, each with the crate that carries it, so the gate stays green on
# what the fork inherited and goes RED on any advisory Marley adds. Regenerate
# this list at every upstream merge (`cargo audit -f Cargo.lock --json`) and
# drop the ids upstream fixed. Inherited at upstream commit 78648aaf7d
# (zed-industries/zed main, 2026-09-18). Unmaintained, unsound and yanked
# notices are warnings and do not fail the gate.

[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa 0.9.10 — Marvin timing side channel; upstream tree (no fixed version)
  "RUSTSEC-2026-0001", # rkyv 0.7.45 — UB in Arc/Rc from_value on OOM; upstream tree
  "RUSTSEC-2026-0194", # quick-xml 0.30/0.37/0.39 — quadratic duplicate-attribute check; upstream tree
  "RUSTSEC-2026-0195", # quick-xml 0.30/0.37/0.39 — NsReader allocation DoS; upstream tree
  "RUSTSEC-2026-0204", # crossbeam-epoch 0.9.18 — fmt::Pointer on an invalid pointer; upstream tree
  "RUSTSEC-2026-0235", # rkyv 0.7.45 — out-of-bounds reads on Rc/Arc archives; upstream tree
  "RUSTSEC-2026-0258", # h2 0.3/0.4 — unbounded empty DATA frames; upstream tree
  "RUSTSEC-2026-0274", # rtrb 0.3.2 — double free in ReadChunk::commit; upstream tree
  "RUSTSEC-2026-0285", # rustls 0.23.40 — TLS 1.3 handshake messages across encryption levels; upstream tree
  # zip 0.6.6 is webrtc-sys-build's, the build script of Zed's LiveKit fork pin
  # (0a1c519cfc), which unpacks LiveKit's prebuilt WebRTC; its `zip = "0.6"` leaves
  # no fixed version in range (the fix is 9.0). Upstream main 322cd509dc
  # (2026-10-16) has the same pin and lock. Listed at #791, 2026-10-16.
  "RUSTSEC-2026-0367", # zip 0.6.6 — SUID/SGID bits kept on extraction; upstream tree
  "RUSTSEC-2026-0368", # zip 0.6.6 — extract makes symlinks pointing outside the destination; upstream tree
  "RUSTSEC-2026-0369", # zip 0.6.6 — Unix permissions applied through symlinks; upstream tree
]
