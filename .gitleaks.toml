# gitleaks config (gate:7). Inherit ALL default secret-detection rules.
# `useDefault = true` is load-bearing: without it the default rules are dropped
# and the gate would detect nothing.
[extend]
useDefault = true

[allowlist]
description = "Non-secrets that trip default rules: Warp's PUBLIC Firebase web API key (designed to ship in clients; security is via Firebase rules, not key secrecy), transcribed verbatim from Warp's OSS client into the warp_architecture reference docs; and RFC 6455's sample Sec-WebSocket-Key (section 1.3, the base64 of 'the sample nonce'), which #583's e2e scenario sends in a WebSocket handshake."
regexes = ['''AIzaSyBdy3O3S9hrdayLJxJ7mriBR4qgUaUygAs''', '''dGhlIHNhbXBsZSBub25jZQ==''']
